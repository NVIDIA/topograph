{{- if and .Values.nodeDataBroker.enabled .Values.nodeDataBroker.rbac.create }}
{{- $acceleratorSource := include "nodeDataBroker.acceleratorSource" . }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "nodeDataBroker.rbacName" . }}
rules:
- apiGroups: [""]
  resources: [nodes]
  verbs: [get,update]
{{- if and (eq .Values.provider.name "infiniband-k8s") (eq $acceleratorSource "nvidia-smi") }}
- apiGroups: [apps]
  resources: [daemonsets]
  verbs: [get]
- apiGroups: [""]
  resources: [pods]
  verbs: [list]
- apiGroups: [""]
  resources: [pods/exec]
  verbs: [create]
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "nodeDataBroker.rbacName" . }}
subjects:
- kind: ServiceAccount
  name: {{ include "nodeDataBroker.serviceAccountName" . }}
  namespace: {{.Release.Namespace}}
  apiGroup: ""
roleRef:
  kind: ClusterRole
  name: {{ include "nodeDataBroker.rbacName" . }}
  apiGroup: rbac.authorization.k8s.io
{{- end }}
