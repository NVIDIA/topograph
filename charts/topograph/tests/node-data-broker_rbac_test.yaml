suite: node-data-broker rbac
# RBAC is rendered through the main chart so provider drives the conditional rules.
release:
  name: chart-ci
  namespace: topograph
tests:
  - it: grants only node access with the default provider
    templates:
      - templates/nodeDataBroker/rbac.yaml
    documentIndex: 0
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: [""]
            resources: [nodes]
            verbs: [get, update]
      - notContains:
          path: rules
          content:
            apiGroups: [""]
            resources: [nodes]
            verbs: [get, list, update]
      - notContains:
          path: rules
          content:
            apiGroups: [""]
            resources: [pods/exec]
            verbs: [create]

  - it: binds RBAC to an existing service account
    templates:
      - templates/nodeDataBroker/rbac.yaml
    set:
      nodeDataBroker:
        serviceAccount:
          create: false
          name: existing-node-data-broker-sa
    documentIndex: 1
    asserts:
      - equal:
          path: roleRef.name
          value: chart-ci-topograph-node-data-broker
      - equal:
          path: roleRef.apiGroup
          value: rbac.authorization.k8s.io
      - equal:
          path: subjects[0].name
          value: existing-node-data-broker-sa

  - it: rejects a missing existing service account name
    templates:
      - templates/nodeDataBroker/rbac.yaml
    set:
      nodeDataBroker:
        serviceAccount:
          create: false
          name: ""
    asserts:
      - failedTemplate:
          errorMessage: "nodeDataBroker.serviceAccount.name must be set when nodeDataBroker.serviceAccount.create=false"

  - it: is omitted when rbac.create is false
    templates:
      - templates/nodeDataBroker/rbac.yaml
    set:
      nodeDataBroker:
        rbac:
          create: false
    asserts:
      - hasDocuments:
          count: 0

  - it: grants pods/exec for explicitly configured infiniband-k8s nvidia-smi discovery
    templates:
      - templates/nodeDataBroker/rbac.yaml
    set:
      provider:
        name: infiniband-k8s
        params:
          accelerator:
            source: nvidia-smi
    documentIndex: 0
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: [apps]
            resources: [daemonsets]
            verbs: [get]
      - notContains:
          path: rules
          content:
            apiGroups: [apps]
            resources: [daemonsets]
            verbs: [get, list]
      - contains:
          path: rules
          content:
            apiGroups: [""]
            resources: [pods]
            verbs: [list]
      - notContains:
          path: rules
          content:
            apiGroups: [""]
            resources: [pods]
            verbs: [get, list]
      - contains:
          path: rules
          content:
            apiGroups: [""]
            resources: [pods/exec]
            verbs: [create]

  - it: drops nvidia-smi permissions when the accelerator section is absent
    templates:
      - templates/nodeDataBroker/rbac.yaml
    set:
      provider:
        name: infiniband-k8s
    documentIndex: 0
    asserts:
      - notContains:
          path: rules
          content:
            apiGroups: [apps]
            resources: [daemonsets]
            verbs: [get]
      - notContains:
          path: rules
          content:
            apiGroups: [""]
            resources: [pods]
            verbs: [list]
      - notContains:
          path: rules
          content:
            apiGroups: [""]
            resources: [pods/exec]
            verbs: [create]

  - it: drops nvidia-smi permissions when using the Kubernetes label accelerator source
    templates:
      - templates/nodeDataBroker/rbac.yaml
    set:
      provider:
        name: infiniband-k8s
        params:
          accelerator:
            source: kubernetes-label
            kubernetesLabel:
              key: nvidia.com/gpu.clique
    documentIndex: 0
    asserts:
      - notContains:
          path: rules
          content:
            apiGroups: [apps]
            resources: [daemonsets]
            verbs: [get]
      - notContains:
          path: rules
          content:
            apiGroups: [""]
            resources: [pods]
            verbs: [list]
      - notContains:
          path: rules
          content:
            apiGroups: [""]
            resources: [pods/exec]
            verbs: [create]

  - it: drops nvidia-smi permissions when accelerator discovery is explicitly disabled
    templates:
      - templates/nodeDataBroker/rbac.yaml
    set:
      provider:
        name: infiniband-k8s
        params:
          accelerator:
            source: none
    documentIndex: 0
    asserts:
      - notContains:
          path: rules
          content:
            apiGroups: [apps]
            resources: [daemonsets]
            verbs: [get]
      - notContains:
          path: rules
          content:
            apiGroups: [""]
            resources: [pods]
            verbs: [list]
      - notContains:
          path: rules
          content:
            apiGroups: [""]
            resources: [pods/exec]
            verbs: [create]

  - it: drops nvidia-smi permissions for an empty accelerator section
    templates:
      - templates/nodeDataBroker/rbac.yaml
    set:
      provider:
        name: infiniband-k8s
        params:
          accelerator: {}
    documentIndex: 0
    asserts:
      - notContains:
          path: rules
          content:
            apiGroups: [apps]
            resources: [daemonsets]
            verbs: [get]
      - notContains:
          path: rules
          content:
            apiGroups: [""]
            resources: [pods]
            verbs: [list]
      - notContains:
          path: rules
          content:
            apiGroups: [""]
            resources: [pods/exec]
            verbs: [create]

  - it: is omitted when the component is disabled
    templates:
      - templates/nodeDataBroker/rbac.yaml
    set:
      nodeDataBroker:
        enabled: false
    asserts:
      - hasDocuments:
          count: 0
