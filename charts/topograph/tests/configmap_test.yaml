suite: config configmap
templates:
  - templates/configmap.yml
release:
  name: chart-ci
  namespace: topograph
tests:
  - it: renders the topograph config with the service port and SSL disabled
    asserts:
      - isKind:
          of: ConfigMap
      - equal:
          path: metadata.name
          value: chart-ci-topograph
      - matchRegex:
          path: data["topograph-config.yaml"]
          pattern: "port: 49021"
      - matchRegex:
          path: data["topograph-config.yaml"]
          pattern: "ssl: false"

  - it: wires the request aggregation delay from values
    set:
      config:
        requestAggregationDelay: 42s
    asserts:
      - matchRegex:
          path: data["topograph-config.yaml"]
          pattern: "requestAggregationDelay: 42s"

  - it: tracks the top-level service port override
    set:
      service:
        port: 30000
    asserts:
      - matchRegex:
          path: data["topograph-config.yaml"]
          pattern: "port: 30000"

  - it: omits credentialsPath unless a credentials secret is configured
    asserts:
      - notMatchRegex:
          path: data["topograph-config.yaml"]
          pattern: "credentialsPath"

  - it: emits credentialsPath when a credentials secret is configured
    set:
      config:
        credentialsSecret: topograph-creds
    asserts:
      - matchRegex:
          path: data["topograph-config.yaml"]
          pattern: "credentialsPath: /etc/topograph/credentials/credentials.yaml"

  - it: publishes shared Kubernetes client limits as provider and engine request defaults
    set:
      provider:
        name: dra
      engine:
        name: slinky
      kubeClient:
        qps: 50
        burst: 100
    asserts:
      - matchRegex:
          path: data["topograph-config.yaml"]
          pattern: "(?s)providerParams:.*kubeQPS: 50.*kubeBurst: 100.*engineParams:.*kubeQPS: 50.*kubeBurst: 100"

  - it: supports configuring only one shared client limit
    set:
      provider:
        name: dra
      engine:
        name: k8s
      kubeClient:
        qps: 50
    asserts:
      - matchRegex:
          path: data["topograph-config.yaml"]
          pattern: "(?ms)providerParams:.*kubeQPS: 50.*kubeBurst: 10$.*engineParams:.*kubeQPS: 50.*kubeBurst: 10$"

  - it: publishes shared defaults independently of the chart-selected components
    set:
      provider:
        name: test
      engine:
        name: slurm
      kubeClient:
        qps: 50
        burst: 100
    asserts:
      - matchRegex:
          path: data["topograph-config.yaml"]
          pattern: "(?s)providerParams:.*kubeQPS: 50.*kubeBurst: 100.*engineParams:.*kubeQPS: 50.*kubeBurst: 100"
