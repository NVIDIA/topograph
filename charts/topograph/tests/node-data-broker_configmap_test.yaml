suite: node-data-broker configmap
templates:
  - templates/nodeDataBroker/configmap.yaml
release:
  name: chart-ci
  namespace: topograph
tests:
  - it: renders provider configuration and the health port
    set:
      provider:
        name: infiniband-k8s
        params:
          accelerator:
            source: nvidia-smi
            nvidiaSmi:
              gpuOperatorNamespace: custom-gpu-operator
              devicePluginDaemonSet: custom-device-plugin
      nodeDataBroker:
        port: 18080
    asserts:
      - isKind:
          of: ConfigMap
      - equal:
          path: metadata.name
          value: chart-ci-topograph-node-data-broker
      - matchRegex:
          path: data["node-data-broker-config.yaml"]
          pattern: "name: infiniband-k8s"
      - matchRegex:
          path: data["node-data-broker-config.yaml"]
          pattern: "source: nvidia-smi"
      - matchRegex:
          path: data["node-data-broker-config.yaml"]
          pattern: "gpuOperatorNamespace: custom-gpu-operator"
      - matchRegex:
          path: data["node-data-broker-config.yaml"]
          pattern: "devicePluginDaemonSet: custom-device-plugin"
      - matchRegex:
          path: data["node-data-broker-config.yaml"]
          pattern: "healthzPort: 18080"

  - it: defaults the nvidia-smi workload location
    set:
      provider:
        name: infiniband-k8s
        params:
          accelerator:
            source: nvidia-smi
    asserts:
      - matchRegex:
          path: data["node-data-broker-config.yaml"]
          pattern: "gpuOperatorNamespace: gpu-operator"
      - matchRegex:
          path: data["node-data-broker-config.yaml"]
          pattern: "devicePluginDaemonSet: nvidia-device-plugin-daemonset"

  - it: does not render nvidia-smi defaults when accelerator is omitted
    set:
      provider:
        name: infiniband-k8s
    asserts:
      - notMatchRegex:
          path: data["node-data-broker-config.yaml"]
          pattern: "gpuOperatorNamespace:"
      - notMatchRegex:
          path: data["node-data-broker-config.yaml"]
          pattern: "devicePluginDaemonSet:"

  - it: does not render nvidia-smi defaults for an empty accelerator section
    set:
      provider:
        name: infiniband-k8s
        params:
          accelerator: {}
    asserts:
      - notMatchRegex:
          path: data["node-data-broker-config.yaml"]
          pattern: "gpuOperatorNamespace:"
      - notMatchRegex:
          path: data["node-data-broker-config.yaml"]
          pattern: "devicePluginDaemonSet:"

  - it: does not render nvidia-smi defaults for the none source
    set:
      provider:
        name: infiniband-k8s
        params:
          accelerator:
            source: none
    asserts:
      - notMatchRegex:
          path: data["node-data-broker-config.yaml"]
          pattern: "gpuOperatorNamespace:"
      - notMatchRegex:
          path: data["node-data-broker-config.yaml"]
          pattern: "devicePluginDaemonSet:"

  - it: forwards LLDP interface selection
    set:
      provider:
        name: lldp-k8s
        params:
          interfaces:
            - eno1
            - eno2
    asserts:
      - matchRegex:
          path: data["node-data-broker-config.yaml"]
          pattern: "interfaces:\\n\\s+- eno1\\n\\s+- eno2"

  - it: forwards LLDP interface regex and rail ID template
    set:
      provider:
        name: lldp-k8s
        params:
          interfaceRegex: '^eth_r([0-9]+)_p[0-9]+$'
          railID: 'rail$1'
    asserts:
      - matchRegex:
          path: data["node-data-broker-config.yaml"]
          pattern: "interfaceRegex: \\^eth_r\\(\\[0-9\\]\\+\\)_p\\[0-9\\]\\+\\$"
      - matchRegex:
          path: data["node-data-broker-config.yaml"]
          pattern: 'railID: rail\$1'
      - matchRegex:
          path: data["node-data-broker-config.yaml"]
          pattern: "nicRailsConfigMap:\\n\\s+name: topograph-nic-rails\\n\\s+namespace: topograph"

  - it: omits the NIC rails ConfigMap reference without a rail ID template
    set:
      provider:
        name: lldp-k8s
        params:
          interfaceRegex: '^eth_r([0-9]+)_p[0-9]+$'
    asserts:
      - notMatchRegex:
          path: data["node-data-broker-config.yaml"]
          pattern: "nicRailsConfigMap:"

  - it: is omitted when node-data-broker is disabled
    set:
      nodeDataBroker:
        enabled: false
    asserts:
      - hasDocuments:
          count: 0
