# OpenSSF Scorecard analysis. Results are uploaded to the repository code
# scanning dashboard and published to https://api.scorecard.dev, which backs
# the public Scorecard badge and viewer.
#
# When publish_results is true the OpenSSF API rejects results from a workflow
# that declares top-level env vars or defaults, grants any workflow-level write
# permission, grants id-token: write to more than one job, or runs the analysis
# job anywhere other than a GitHub-hosted Ubuntu runner. Keep this file within
# those limits when editing it.

name: OpenSSF Scorecard

on:
  schedule:
    # Mondays at 06:00 UTC.
    - cron: '0 6 * * 1'
  push:
    branches:
      - main
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    # Required by the publishing rules above; the rest of this repository runs
    # on the self-hosted linux-amd64-* pool, which is not accepted here.
    runs-on: ubuntu-latest
    permissions:
      # Upload the SARIF result to the code scanning dashboard.
      security-events: write
      # Mint the OIDC token that authenticates the result to the OpenSSF API.
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload results to code scanning
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: results.sarif
